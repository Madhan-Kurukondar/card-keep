name: Build ScanRecall v0.3 beta

on:
  push:
    branches: [ scanrecall-v0.3 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)"
          test -n "$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building ScanRecall $VERSION_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build beta APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          OUT="ScanRecall-Android-v${VERSION_NAME}.apk"

          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

          PERMS="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK")"
          echo "$PERMS"
          echo "$PERMS" | grep -q "android.permission.CAMERA"
          ! echo "$PERMS" | grep -q "android.permission.INTERNET"
          ! echo "$PERMS" | grep -q "android.permission.ACCESS_NETWORK_STATE"

          MANIFEST="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK")"
          echo "$MANIFEST"
          echo "$MANIFEST" | grep -q 'package="com.madhankurukondar.scanrecall.beta"'
          echo "$MANIFEST" | grep -q 'android:label="ScanRecall Beta"'

          unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml'
          unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher_round.xml'

          mkdir -p dist
          cp "$APK" "dist/$OUT"
          sha256sum "dist/$OUT" > "dist/${OUT%.apk}.sha256"
          ls -lh "dist/$OUT"

      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanRecall-Android-v${{ steps.version.outputs.version_name }}
          path: dist/
          if-no-files-found: error
