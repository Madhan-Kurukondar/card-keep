name: Publish CardKeep v0.2.1

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-v0.2.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact ArivEmb brand asset
        run: |
          test "$(wc -c < app/src/main/res/drawable-nodpi/arivemb_symbol.jpg)" -eq 10064
          test "$(git hash-object app/src/main/res/drawable-nodpi/arivemb_symbol.jpg)" = "2ea0958d3f48095f1a78108da55200fa96d15424"
          test "$(git hash-object branding/arivemb-symbol.jpg)" = "2ea0958d3f48095f1a78108da55200fa96d15424"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build canonical APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and package
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          PERMS="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK")"
          echo "$PERMS"
          echo "$PERMS" | grep -q "android.permission.CAMERA"
          ! echo "$PERMS" | grep -q "android.permission.INTERNET"
          ! echo "$PERMS" | grep -q "android.permission.ACCESS_NETWORK_STATE"
          mkdir -p dist
          cp "$APK" dist/CardKeep-Android-v0.2.1.apk
          sha256sum dist/CardKeep-Android-v0.2.1.apk > dist/CardKeep-Android-v0.2.1.sha256
          ls -lh dist/CardKeep-Android-v0.2.1.apk

      - name: Upload canonical build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardKeep-Android-v0.2.1
          path: dist/
          if-no-files-found: error

      - name: Create or replace public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # CardKeep Android v0.2.1

          Packaging and branding repair release.

          - exact supplied ArivEmb symbol verified by binary hash
          - exact supplied ArivEmb symbol used for launcher icon and in-app branding
          - README uses the same verified ArivEmb symbol
          - ARM-only Android package for smaller, more reliable phone downloads
          - Conference Mode retained
          - OCR, local storage, contact creation and vCard core unchanged
          - no Internet permission
          EOF

          if gh release view v0.2.1 >/dev/null 2>&1; then
            gh release upload v0.2.1               dist/CardKeep-Android-v0.2.1.apk               dist/CardKeep-Android-v0.2.1.sha256               --clobber
            gh release edit v0.2.1               --target "$GITHUB_SHA"               --title "CardKeep Android v0.2.1"               --notes-file RELEASE_NOTES.md               --latest
          else
            gh release create v0.2.1               dist/CardKeep-Android-v0.2.1.apk               dist/CardKeep-Android-v0.2.1.sha256               --target "$GITHUB_SHA"               --title "CardKeep Android v0.2.1"               --notes-file RELEASE_NOTES.md               --latest
          fi
