name: Publish CardKeep v0.1.2

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-v0.1.2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and package
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          PERMS="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$APK")"
          echo "$PERMS"
          echo "$PERMS" | grep -q "android.permission.CAMERA"
          ! echo "$PERMS" | grep -q "android.permission.INTERNET"
          ! echo "$PERMS" | grep -q "android.permission.ACCESS_NETWORK_STATE"
          mkdir -p dist
          cp "$APK" dist/CardKeep-Android-v0.1.2.apk
          sha256sum dist/CardKeep-Android-v0.1.2.apk > dist/CardKeep-Android-v0.1.2.sha256

      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # CardKeep Android v0.1.2

          CardKeep now carries the ArivEmb visual system while keeping the scanning and contact core unchanged.

          ## UI refresh
          - ArivEmb silicon / navy / magenta theme
          - ArivEmb app icon and identity
          - branded hero and privacy panels
          - rounded contact cards and form fields
          - clearer section hierarchy
          - icon-style action buttons
          - improved dark-mode readability

          ## Core
          - on-device OCR
          - camera permission flow
          - local contact/context storage
          - Android contact creation
          - vCard export
          - no Internet permission
          EOF

          if gh release view v0.1.2 >/dev/null 2>&1; then
            gh release upload v0.1.2 dist/CardKeep-Android-v0.1.2.apk dist/CardKeep-Android-v0.1.2.sha256 --clobber
            gh release edit v0.1.2 --title "CardKeep Android v0.1.2" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create v0.1.2 dist/CardKeep-Android-v0.1.2.apk dist/CardKeep-Android-v0.1.2.sha256 --target "$GITHUB_SHA" --title "CardKeep Android v0.1.2" --notes-file RELEASE_NOTES.md --latest
          fi
