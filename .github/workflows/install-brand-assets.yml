name: Install exact ArivEmb brand asset

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/install-brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact supplied ArivEmb symbol
        run: |
          cat .brand-source/symbol.part00 .brand-source/symbol.part01 .brand-source/symbol.part02 | base64 -d > /tmp/arivemb-symbol.jpg

          echo "Size:"
          wc -c /tmp/arivemb-symbol.jpg
          echo "Git blob hash:"
          git hash-object /tmp/arivemb-symbol.jpg

          test "$(wc -c < /tmp/arivemb-symbol.jpg)" -eq 10064
          test "$(git hash-object /tmp/arivemb-symbol.jpg)" = "2ea0958d3f48095f1a78108da55200fa96d15424"

          mkdir -p app/src/main/res/drawable-nodpi branding
          cp /tmp/arivemb-symbol.jpg app/src/main/res/drawable-nodpi/arivemb_symbol.jpg
          cp /tmp/arivemb-symbol.jpg branding/arivemb-symbol.jpg

      - name: Commit exact brand asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/arivemb_symbol.jpg branding/arivemb-symbol.jpg
          if git diff --cached --quiet; then
            echo "Exact logo already installed"
          else
            git commit -m "Install exact supplied ArivEmb symbol"
            git push
          fi
